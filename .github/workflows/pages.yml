name: Deploy the explainer site to GitHub Pages

# Publishes knowledge-base/explanations/ — the human-facing explainer site — to GitHub Pages.
# Uploaded verbatim as the site root, so anything added there is published.
# Static files only — no build.

on:
  push:
    branches: [main]
    paths:
      - 'knowledge-base/explanations/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the explainer site
        uses: actions/upload-pages-artifact@v3
        with:
          path: knowledge-base/explanations
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
