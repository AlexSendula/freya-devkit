name: Deploy the explainer site to GitHub Pages

# Publishes knowledge-base/explanations/ — the human-facing explainer site — to GitHub Pages.
# Uploaded verbatim as the site root, so anything added there is published.
# Static files only — no build.

on:
  push:
    branches: [main]
    paths:
      - 'knowledge-base/explanations/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout still defaults this to true (its own action.yml:52-54, read at
          # the SHA above), so this job's GITHUB_TOKEN — the one carrying `pages:
          # write` and `id-token: write` — is written into .git/config as an
          # extraheader that every later step in the job can read. upload-pages-artifact
          # is deliberately given no token; persisting them hands it one for free.
          # Nothing after this step runs git, so switching it off costs nothing.
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload the explainer site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: knowledge-base/explanations
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
